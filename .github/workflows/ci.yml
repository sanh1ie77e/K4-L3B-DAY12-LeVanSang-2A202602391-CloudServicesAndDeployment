name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_API_KEY: ci-dummy
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline checkpoints
        run: >-
          pytest tests/ -v
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy tested commit
        run: >-
          railway up --ci
          --project "${{ vars.RAILWAY_PROJECT_ID }}"
          --environment production
          --service day12-agent

      - name: Smoke test production
        run: |
          sleep 45
          curl --fail --silent --show-error "${{ vars.PUBLIC_URL }}/health"
